services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: "file:/app/data/dev.db"
      JWT_SECRET: "docker-compose-local-secret"
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "3333:3333"
    volumes:
      - backend-sqlite-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:3333"
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  backend-sqlite-data:
